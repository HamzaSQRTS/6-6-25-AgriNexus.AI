<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      const savedTheme = localStorage.getItem("agrinexus_theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AgriNexus.Ai</title>
  <meta name="description" content="Access your AgriNexus.Ai account.">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/global.css?v=2">
  <link rel="stylesheet" href="css/auth.css?v=2">
  <style>
    html[dir="rtl"] {
      font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
    }
    html[dir="rtl"] div[style*="right: 20px"] {
      right: auto !important;
      left: 20px !important;
    }
  </style>
</head>
<body style="background: var(--bg-void);">

  <!-- Absolute positioned lang/theme toggles -->
  <div style="position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; gap: 10px;">
    <button id="btn-lang-toggle" class="nav-btn" style="background: rgba(20, 184, 166, 0.15); border: 1px solid rgba(20, 184, 166, 0.4); color: var(--teal-400); cursor: pointer; padding: 6px 14px; border-radius: 8px; font-weight: 700; transition: all 0.2s ease;">اردو</button>
    <button id="btn-theme-toggle" class="nav-btn" style="background: rgba(20, 184, 166, 0.15); border: 1px solid rgba(20, 184, 166, 0.4); color: var(--teal-400); cursor: pointer; padding: 6px 14px; border-radius: 8px; font-weight: 700; transition: all 0.2s ease;" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
  </div>

  <!-- Ambient Glows -->
  <div class="ambient-glow green"></div>
  <div class="ambient-glow teal"></div>

  <!-- Main Login Page Content -->
  <main class="login-page">
    
    <div class="login-header animate-slide-down">
      <a href="index.html" class="auth-logo">
        <div class="auth-logo-icon"><i class="fa-solid fa-leaf"></i></div>
        <div class="auth-logo-text">
          <div class="auth-logo-name" data-translate="brand">AgriNexus<span>.Ai</span></div>
        </div>
      </a>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
      <div class="auth-card-inner">
        
        <div class="auth-tabs">
          <button class="auth-tab active" data-target="login" data-translate="auth_login">Login</button>
          <button class="auth-tab" data-target="register" data-translate="auth_register">Register</button>
        </div>

        <div id="auth-error" class="auth-error"></div>

        <!-- Login Form -->
        <form id="login-form" class="auth-panel active">
          <div class="form-group">
            <label class="form-label" data-translate="auth_email">Email Address</label>
            <input type="email" id="login-email" class="form-input" placeholder="farmer@example.com" data-translate-placeholder="auth_email" required>
          </div>
          <div class="form-group">
            <label class="form-label" data-translate="auth_password">Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" data-translate-placeholder="auth_password" required>
          </div>
          <div class="form-group" style="margin-top: 8px;">
            <label class="form-label" data-translate="auth_select_role">Select Role</label>
            <div class="role-selector">
              <label class="role-option selected">
                <input type="radio" name="login-role" value="farmer" checked>
                <i class="fa-solid fa-tractor role-icon"></i>
                <span class="role-label" data-translate="auth_role_farmer">Farmer</span>
              </label>
              <label class="role-option">
                <input type="radio" name="login-role" value="admin">
                <i class="fa-solid fa-shield-halved role-icon"></i>
                <span class="role-label" data-translate="auth_role_admin">Admin</span>
              </label>
            </div>
          </div>

          <button type="submit" class="auth-submit" id="btn-login" style="margin-top: 8px;">
            <span data-translate="auth_btn_access">Access Dashboard</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-panel">
          <div class="form-group">
            <label class="form-label" data-translate="auth_full_name">Full Name</label>
            <input type="text" id="reg-name" class="form-input" placeholder="John Doe" data-translate-placeholder="auth_full_name" required>
          </div>
          <div class="form-group">
            <label class="form-label" data-translate="auth_email">Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="john@example.com" data-translate-placeholder="auth_email" required>
          </div>
          <div class="form-group">
            <label class="form-label" data-translate="auth_password">Password</label>
            <input type="password" id="reg-password" class="form-input" placeholder="Min. 6 characters" data-translate-placeholder="auth_password" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" data-translate="auth_location">City / Location</label>
            <div id="reg-city-dropdown-host"></div>
            <input type="hidden" id="reg-city" required>
          </div>
          <div class="form-group" style="margin-top: 10px;">
            <label class="form-label" data-translate="auth_land_size">Land Size (Acres)</label>
            <select id="reg-acres" class="form-input" style="background: var(--bg-surface-elevated); color: #fff; border: 1px solid var(--border-dim); height: 42px; border-radius: 8px; cursor: pointer; padding: 0 12px; width: 100%;" required>
              <option value="" disabled selected data-translate="auth_select_land">Select land size...</option>
              <option value="1" data-translate="auth_land_less_1">Less than 1 Acre</option>
              <option value="5" data-translate="auth_land_1_5">1 - 5 Acres</option>
              <option value="10" data-translate="auth_land_5_10">5 - 10 Acres</option>
              <option value="20" data-translate="auth_land_10_20">10 - 20 Acres</option>
              <option value="50" data-translate="auth_land_20_50">20 - 50 Acres</option>
              <option value="100" data-translate="auth_land_50_plus">50+ Acres</option>
            </select>
          </div>

          <button type="submit" class="auth-submit" id="btn-register" style="margin-top: 8px;">
            <span data-translate="auth_btn_create">Create Account</span>
            <i class="fa-solid fa-user-plus"></i>
          </button>
        </form>

      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Language Translations -->
  <script src="js/lang_data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const toggleBtn = document.getElementById("btn-lang-toggle");
      let currentLang = localStorage.getItem("agrinexus_lang") || "en";
      
      function applyTranslations(lang) {
        const dictionary = window.AGRINEXUS_TRANSLATIONS[lang];
        if (!dictionary) return;
        
        // Set document direction
        document.documentElement.dir = lang === "ur" ? "rtl" : "ltr";
        document.documentElement.lang = lang;
        
        // Translate all elements with data-translate attribute
        document.querySelectorAll("[data-translate]").forEach(el => {
          const key = el.getAttribute("data-translate");
          if (dictionary[key]) {
            const icon = el.querySelector("i");
            if (icon) {
              el.innerHTML = "";
              el.appendChild(icon);
              el.appendChild(document.createTextNode(" " + dictionary[key]));
            } else {
              el.textContent = dictionary[key];
            }
          }
        });

        // Translate placeholders
        document.querySelectorAll("[data-translate-placeholder]").forEach(el => {
          const key = el.getAttribute("data-translate-placeholder");
          if (dictionary[key]) {
            el.setAttribute("placeholder", dictionary[key]);
          }
        });
        
        // Update toggle button text
        toggleBtn.textContent = lang === "en" ? "اردو" : "English";
      }
      
      toggleBtn.addEventListener("click", () => {
        currentLang = currentLang === "en" ? "ur" : "en";
        localStorage.setItem("agrinexus_lang", currentLang);
        applyTranslations(currentLang);
      });

      // Theme Toggler
      const themeToggleBtn = document.getElementById("btn-theme-toggle");
      let currentTheme = localStorage.getItem("agrinexus_theme") || "dark";

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        if (themeToggleBtn) {
          const icon = themeToggleBtn.querySelector("i");
          if (icon) {
            icon.className = theme === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon";
          }
        }
      }

      if (themeToggleBtn) {
        themeToggleBtn.addEventListener("click", () => {
          currentTheme = currentTheme === "dark" ? "light" : "dark";
          localStorage.setItem("agrinexus_theme", currentTheme);
          applyTheme(currentTheme);
        });
      }

      applyTheme(currentTheme);
      
      // Initialize
      applyTranslations(currentLang);
    });
  </script>

  <!-- Application Logic -->
  <script type="module" src="js/api.js?v=2"></script>
  <script type="module" src="js/auth.js?v=2"></script>

</body>
</html>
